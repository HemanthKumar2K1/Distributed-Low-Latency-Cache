# Redis for the Module 6 comparison: the same test against real Redis, to compare with Cache System.
# Kept as close to our cache as Redis allows, so the comparison is fair.
# Paths are relative to this folder: start it with ./start-redis.sh (which cd's here first).

# Same rules as our nodes: local only, no password.
bind 127.0.0.1
port 6379
protected-mode yes

# Like Cache System: nothing saved to disk.
save ""
appendonly no

# Like Cache System: no size limit, nothing evicted.
maxmemory 0
maxmemory-policy noeviction

# FLUSHALL is used by Product Catalogue's cache on/off switch, SHUTDOWN by "Stop node".
# Both are allowed by default in Redis.

# Runs in the background; stop it with ./stop-redis.sh
daemonize yes
pidfile run/redis.pid
logfile logs/redis.log
loglevel notice
