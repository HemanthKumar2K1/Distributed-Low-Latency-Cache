spring.application.name=Product Catalogue

spring.datasource.url=jdbc:postgresql://localhost:5432/distributed_cache
spring.datasource.hikari.pool-name=product-pool

# --- Connection pool sizing (drives the "DB connections in use" / poolActive metric) ---
# Most DB connections open at once. Raise it if poolActive sits at poolMax with requests waiting.
spring.datasource.hikari.maximum-pool-size=10

# --- Measurement hygiene ---
# Without this, Spring holds the DB connection until the JSON response is written.
spring.jpa.open-in-view=false

# --- Product cache switch ---
# false = baseline, every read goes to PostgreSQL
# true  = reads go through the cache
# Override without editing: --product.cache.enabled=false  (IntelliJ: Program arguments)
product.cache.enabled=true

# --- Cache System (a separate process: start the nodes with cache-system/start-nodes.sh) ---
# If it is down, reads still work through PostgreSQL and cache_errors_total goes up.
# Keys are spread over these nodes by a consistent hash ring.
# A node that is down only loses ITS keys (they go to PostgreSQL).
product.cache.remote.nodes=127.0.0.1:7001,127.0.0.1:7002,127.0.0.1:7003
product.cache.remote.virtual-nodes=150
# Short on purpose: a slow cache is worse than none, the request must still read the DB after.
product.cache.remote.connect-timeout-ms=10
product.cache.remote.read-timeout-ms=20
# Per node. Up to 200 Tomcat threads, so 200 connections means no request waits for one. Opened only when needed.
product.cache.remote.pool-size=200
product.cache.remote.borrow-timeout-ms=20
# Circuit breaker per node. After 3 network failures in a row the node is skipped
# (no network call, no timeout) for 5 s, then one trial call decides: back to normal, or 5 s more.
product.cache.remote.breaker-threshold=3
product.cache.remote.breaker-cooldown-ms=5000

management.endpoints.web.exposure.include=health,prometheus
